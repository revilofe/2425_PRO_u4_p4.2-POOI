name: Feedback CI

on:
  push:
  pull_request:
    branches: [ main ] 

jobs:
  feedback:
    runs-on: ubuntu-latest
    permissions: # Necesario para escribir comentarios en PRs
      pull-requests: write
      issues: write # createComment usa issues API
      contents: read # Para checkout
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        id: tests_execution
        run: ./gradlew test --no-daemon
        continue-on-error: true # Para que el workflow continúe al paso de feedback incluso si los tests fallan

      - name: Post Test Feedback
        if: always() # Asegura que este paso se ejecute incluso si los tests fallan
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { Octokit } = require("@octokit/core");
            const fs = require('fs');
            const path = require('path');
            const { promisify } = require('util');
            const glob = promisify(require('glob'));

            let numTests = 0;
            let numFailed = 0;
            let numErrors = 0; // JUnit distingue errores de fallos
            let numSkipped = 0;
            let numPassed = 0;
            let compileError = false;
            
            const testStepOutput = `${{ steps.tests_execution.outcome }}`; // success, failure, or skipped

            try {
              const reportFiles = await glob('build/test-results/test/TEST-*.xml');
              if (reportFiles.length > 0) {
                for (const file of reportFiles) {
                  const xmlData = fs.readFileSync(file, 'utf8');
                  // Simple regex parsing for key attributes in <testsuite>
                  const testsMatch = xmlData.match(/<testsuite[^>]*tests="(\d+)"/);
                  const failuresMatch = xmlData.match(/<testsuite[^>]*failures="(\d+)"/);
                  const errorsMatch = xmlData.match(/<testsuite[^>]*errors="(\d+)"/);
                  const skippedMatch = xmlData.match(/<testsuite[^>]*skipped="(\d+)"/); // o <testcase ... skipped="..."/>

                  if (testsMatch) numTests += parseInt(testsMatch[1]);
                  if (failuresMatch) numFailed += parseInt(failuresMatch[1]);
                  if (errorsMatch) numErrors += parseInt(errorsMatch[1]);
                  if (skippedMatch) numSkipped += parseInt(skippedMatch[1]); // Puede requerir sumar <testcase skipped="1"/>
                }
                numPassed = numTests - numFailed - numErrors - numSkipped;
              } else {
                // No XML reports found - could be compile error or no tests run
                if (testStepOutput === 'failure') {
                    compileError = true;
                }
                // numTests will remain 0
              }
            } catch (error) {
              console.error("Error parsing test results:", error);
              // If XML parsing fails, indicate an issue with test reporting
              numTests = -1; // Special value to indicate parsing error
            }
            
            // Refine compileError check based on testStepOutput if no tests were parsed
            if (numTests === 0 && testStepOutput === 'failure') {
                compileError = true;
            }
            if (numTests === -1 && testStepOutput === 'failure'){ // XML parsing failed AND test step failed
                compileError = true; // Assume compile error if XMLs are unparseable and tests failed
            }


            let feedbackMessage = `## Resumen de Pruebas de Kotlin POO 🐘

`;
            feedbackMessage += `**Resultados Cuantitativos:**
`;
            if (compileError) {
              feedbackMessage += `🚨 **Error de Compilación o Ejecución de Tests:**
`;
              feedbackMessage += `No se pudieron ejecutar los tests correctamente. Parece que hay un error de compilación o un problema durante la fase de testing.
`;
            } else if (numTests === -1) {
              feedbackMessage += `⚠️ **Error al Procesar Resultados de Tests:**
`;
              feedbackMessage += `No se pudieron parsear los resultados de los tests desde los archivos XML. Revisa los logs del workflow.
`;
            } else if (numTests === 0) {
              feedbackMessage += `🤔 **No se ejecutaron tests:**
`;
              feedbackMessage += `El proceso de tests finalizó, pero no se reportó la ejecución de ningún test.
`;
              feedbackMessage += `Asegúrate de que tus clases de test están correctamente nombradas (ej. \`NombreClaseTest.kt\`) y ubicadas en \`src/test/kotlin\`.
`;
            } else {
              feedbackMessage += `- **Total Tests Encontrados (en XML):** ${numTests}
`;
              feedbackMessage += `- **Tests Pasados:** ${numPassed} ✅
`;
              feedbackMessage += `- **Tests Fallidos:** ${numFailed} ❌
`;
              if (numErrors > 0) {
                feedbackMessage += `- **Tests con Errores (ejecución):** ${numErrors} 💥
`;
              }
              if (numSkipped > 0) {
                feedbackMessage += `- **Tests Saltados:** ${numSkipped} ⏩
`;
              }
              feedbackMessage += `

`;
            }

            feedbackMessage += `**Feedback Cualitativo:**
`;
            if (compileError) {
              feedbackMessage += `🚨 **Errores Detectados:**
`;
              feedbackMessage += `Tu código no compiló o los tests no pudieron ejecutarse correctamente. Revisa los logs del paso "Run tests" para identificar los problemas. Asegúrate de que todas las clases y métodos están correctamente implementados según las especificaciones.
`;
            } else if (numTests === -1) {
                feedbackMessage += `⚠️ **Problema con Reportes de Test:**
`;
                feedbackMessage += `Hubo un inconveniente al leer los detalles de los tests. Por favor, verifica la configuración de los reportes JUnit XML en tu proyecto y revisa los logs del workflow.
`;
            } else if (numFailed > 0 || numErrors > 0) {
              feedbackMessage += `⚠️ **Algunos Tests Fallaron o Tuvieron Errores:**
`;
              const totalProblemas = numFailed + numErrors;
              feedbackMessage += `Se encontraron ${totalProblemas} test(s) con problemas (${numFailed} fallidos, ${numErrors} con errores). ¡No te desanimes! Este es un buen momento para practicar tus habilidades de depuración.
`;
              feedbackMessage += `**Sugerencias:**
`;
              feedbackMessage += `- Revisa cuidadosamente los mensajes de error en la pestaña "Checks" de esta Pull Request (o en los logs del workflow si fue un push directo), especialmente en la salida del paso "Run tests".
`;
              feedbackMessage += `- Compara tu código con los requisitos de cada ejercicio, especialmente los casos límite.
`;
              feedbackMessage += `- Ejecuta los tests localmente en tu máquina para depurar más fácilmente con el comando \`./gradlew test\`.
`;
            } else if (numTests > 0 && numFailed === 0 && numErrors === 0) {
              feedbackMessage += `🎉 **¡Excelente Trabajo!**
`;
              feedbackMessage += `Todos los ${numTests} tests han pasado exitosamente (Pasados: ${numPassed}, Saltados: ${numSkipped}). ¡Felicidades!
`;
              feedbackMessage += `**Siguientes Pasos y Buenas Prácticas:**
`;
              feedbackMessage += `- Asegúrate de que tu código es claro, legible y está bien comentado donde es necesario.
`;
              feedbackMessage += `- Revisa si has seguido las convenciones de estilo de Kotlin.
`;
              feedbackMessage += `- Considera si hay casos extremos o adicionales que podrías probar por tu cuenta.
`;
            } else if (numTests === 0 && !compileError) { // Ya cubierto arriba, pero por si acaso.
                 feedbackMessage += `🤔 **No se ejecutaron tests:**
`;
                 feedbackMessage += `El proceso de tests finalizó, pero no se reportó la ejecución de ningún test. Esto podría indicar un problema con la configuración de los tests o que no hay tests definidos en el proyecto.
`;
                 feedbackMessage += `Asegúrate de que tus clases de test están correctamente nombradas (ej. \`NombreClaseTest.kt\`) y ubicadas en \`src/test/kotlin\`.
`;
            }


            feedbackMessage += `
---
`;
            feedbackMessage += `*Este es un mensaje automático generado por el sistema de feedback CI.*`;

            if (context.payload.pull_request) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: feedbackMessage
                });
              } catch (e) {
                console.error("Error creating PR comment:", e);
                console.log("Feedback message that would have been posted:\n", feedbackMessage);
              }
            } else {
              console.log("Contexto del evento:", context.eventName);
              console.log("Este workflow fue disparado por un evento de tipo:", context.eventName, "y no por una pull request. El feedback se mostrará aquí en los logs.");
              console.log(feedbackMessage);
            }
